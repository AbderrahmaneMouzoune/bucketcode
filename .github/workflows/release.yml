name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the version currently on main to npm, without waiting for a new release'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs['packages/bucketcode--tag_name'] }}
      version: ${{ steps.release.outputs['packages/bucketcode--version'] }}

    steps:
      # Keeps a release pull request open with the next version and the changelog
      # entry it would ship, both derived from the conventional commits on main.
      # Merging that pull request is what tags the version and creates the GitHub
      # release, which is when the publish job below runs.
      #
      # RELEASE_PLEASE_TOKEN is optional: a personal access token with `contents`
      # and `pull-requests` write access makes CI run on the release pull request.
      # GitHub does not trigger workflows on pull requests opened with the default
      # GITHUB_TOKEN, so without it the release pull request shows no checks.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm --filter bucketcode test

      - run: pnpm build

      # Drop NODE_AUTH_TOKEN and configure this repository as a trusted
      # publisher on npm to publish through OIDC instead of a token.
      - name: Publish
        working-directory: packages/bucketcode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
