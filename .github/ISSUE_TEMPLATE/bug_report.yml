name: Bug report
description: Something in s3nd does not behave the way it is documented.
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful thing you can give us is the
        smallest snippet that reproduces the problem.

  - type: dropdown
    id: package
    attributes:
      label: Which package
      options:
        - s3nd
        - '@s3nd/protocol'
        - '@s3nd/react'
        - '@s3nd/cli'
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A snippet, or a link to a repository. Redact your credentials.
      render: ts
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: 'Node 22.11.0, or Next 16 route handler'
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options:
        - AWS S3
        - Cloudflare R2
        - MinIO
        - Scaleway
        - Wasabi
        - Other S3-compatible
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The full error, including its `code` and `cause`.
      render: shell
